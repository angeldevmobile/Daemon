id       = "thread-migration"
title    = "Latency-critical thread keeps migrating between cores"
category = "sched"
severity = "medium"
platform = "linux"
goal     = ["latency", "stability"]
order    = 40

[detect]
check    = "thread_migration"
target   = "hot_threads"
min_rate = 1.0           # migrations per second

[explain]
summary = """
Each time the scheduler moves a thread to another core, it starts with cold caches and may land
next to other work. Pinning a hot thread keeps its caches warm, but can cost throughput when the
core is shared, so the fix is measured against a throughput guardrail.
"""
evidence = ["/proc/*/task/*/sched", "/proc/*/task/*/status"]

[fix]
action = "pin_thread"
to     = "current_core"
risk   = "medium"
reboot = false

[fix.conflicts]
systemd = "CPUAffinity= or AllowedCPUs= on the unit limits which cores the thread can be pinned to"

[references]
links = ["https://man7.org/linux/man-pages/man2/sched_setaffinity.2.html"]
