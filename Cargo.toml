[workspace]
resolver = "3"
members = [
    "crates/hpcd-core",
    "crates/hpcd-probe",
    "crates/hpcd-rules",
    "crates/hpcd-ebpf",
    "crates/hpcd-measure",
    "crates/hpcctl",
    "bench/jitter-demo",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/angeldevmobile/Daemon"

[workspace.dependencies]
hpcd-core = { path = "crates/hpcd-core" }
hpcd-probe = { path = "crates/hpcd-probe" }
hpcd-rules = { path = "crates/hpcd-rules" }
hpcd-ebpf = { path = "crates/hpcd-ebpf" }
hpcd-measure = { path = "crates/hpcd-measure" }

anstream = "1"
anstyle = "1"
anyhow = "1"
aya = "=0.14.0"
aya-build = "=0.2.1"
aya-ebpf = "=0.2.1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[profile.release]
codegen-units = 1

[profile.release.package.hpcd-ebpf]
debug = 2
